name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, for the one thing this workflow does that is not a
  # gate: the macOS job's report-mode artifact is the only route this
  # project has to a real Accelerate observation, and asking for one
  # should not require inventing a commit to push. See docs/ci.md.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-clang-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}

      - name: Install ninja and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libomp-dev

      - name: Install Intel MKL via the oneAPI apt repository
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel
          # cmake/FindMKL.cmake's only environment-free fallback paths are
          # /opt/intel/oneapi/mkl/latest/{include,lib,lib/intel64} and, for
          # libiomp5, /opt/intel/oneapi/compiler/latest/lib. Every other
          # oneAPI layout it knows how to search (older packages put
          # libiomp5 under compiler/latest/linux/compiler/lib/intel64_lin,
          # for example) is reachable only via $ENV{ONEAPI_ROOT} /
          # $ENV{MKLROOT}. Exporting both here makes MKL discovery
          # able to find libiomp5 outside the hardcoded fallbacks instead of depending on apt happening to match
          # the three hardcoded fallbacks.
          echo "ONEAPI_ROOT=/opt/intel/oneapi" >> "$GITHUB_ENV"
          echo "MKLROOT=/opt/intel/oneapi/mkl/latest" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset linux-clang-release

      - name: Build
        run: cmake --build build

      - name: Test
        # No HVEN_RIG_MACHINE here, by design: the committed MKL float rows are
        # pinned to the machine they were derived on, and this runner is not it,
        # so they report CONTEXT-MISMATCH rather than asserting. Labelling this
        # runner as the derivation machine would make them assert against
        # hardware they were never observed on, which is the false claim the
        # context gate exists to prevent.
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Accelerate backend syntax check (Linux, stubbed)
        # Cheap (a handful of `clang++ -fsyntax-only` calls, no MKL/network
        # needed) and Linux-runnable, so it belongs in the same job rather
        # than a separate one. Keeps scripts/check_accelerate_syntax_linux.sh's
        # claim -- "syntax-checked against stubs on Linux" -- continuously
        # true instead of rotting silently the first time someone edits the
        # Accelerate TUs without running it locally. See that script's own
        # header comment and docs/testing.md for exactly what this does and
        # does not prove; it is not a substitute for the Mac hardware leg.
        run: ./scripts/check_accelerate_syntax_linux.sh

      # Precompiled-header neutrality: builds hven twice (with and without
      # the PCH) and requires every object and libhven.a to come out
      # byte-identical, plus asserts the PCH is actually engaged on exactly
      # the six translation units it is opted in for.
      #
      # This is the enforcement half of the PCH's licence to exist. The PCH
      # sits over engine headers and is permitted only because it changes
      # nothing the compiler emits; that was measured once when it landed,
      # and without this step it would decay silently -- reordering
      # src/hven_pch.h's include list, or letting clang-format alphabetize
      # the include block of src/drivers/interior_point_solver.cpp, breaks
      # the property without breaking the build. See docs/build.md.
      #
      # Linux only. The full two-build comparison is the expensive half, and
      # this is the lane where a regression would be introduced and caught
      # first; the macOS and Windows lanes get the cheap engagement half
      # instead (see their own steps below), because a full neutrality run on
      # those lanes is Mac-leg territory. docs/build.md records that
      # disposition.
      - name: Assert PCH neutrality (Linux)
        env:
          HVEN_PCH_NEUTRALITY_JOBS: "6"
        run: ./scripts/check_pch_neutrality.sh

      # Install-verification: proves `cmake --install` + a downstream
      # `find_package(hven)` consumer actually link and run, and that the
      # exported hvenTargets.cmake carries exactly the platform/ABI
      # contract the root CMakeLists.txt documents (no more, no less).
      # Run on all three lanes -- see the matching steps in the macOS and
      # Windows jobs below, and scripts/check_export_contract.sh (shared
      # by all three) for what "exactly the contract" means. HVEN_INSTALL_
      # SMOKE_WORKDIR keeps the scratch build/install tree around after
      # the script returns so the next step can inspect the installed
      # hvenTargets.cmake and the hven configure log; a plain local run of
      # the script (no env var set) still self-cleans as before.
      - name: Run hven install smoke (configure/build/install/consume)
        env:
          HVEN_INSTALL_SMOKE_WORKDIR: ${{ runner.temp }}/hven-install-smoke
          HVEN_INSTALL_SMOKE_JOBS: "6"
        run: ./scripts/check_install_smoke.sh

      - name: Assert installed export contract (Linux)
        env:
          HVEN_INSTALL_SMOKE_WORKDIR: ${{ runner.temp }}/hven-install-smoke
        run: |
          set -euo pipefail
          targets_file="$(find "${HVEN_INSTALL_SMOKE_WORKDIR}/hven-install" -name hvenTargets.cmake -print -quit)"
          if [ -z "${targets_file}" ]; then
            echo "hvenTargets.cmake not found under ${HVEN_INSTALL_SMOKE_WORKDIR}/hven-install" >&2
            exit 1
          fi
          align="$(grep -oE 'resolved to [0-9]+' "${HVEN_INSTALL_SMOKE_WORKDIR}/hven-configure.log" | grep -oE '[0-9]+' || true)"
          if [ -z "${align}" ]; then
            echo "could not find the computed EIGEN_MAX_ALIGN_BYTES value in ${HVEN_INSTALL_SMOKE_WORKDIR}/hven-configure.log" >&2
            exit 1
          fi
          ./scripts/check_export_contract.sh "${targets_file}" linux "${align}"

  macos-clang-release:
    # This job raised the milestone's Apple-hardware claim ceiling: the
    # Accelerate session, shim, and Apple-gated test halves
    # (src/linear/accelerate_session.cpp, symmetric_factor_accelerate.cpp,
    # tests/linear's `#if defined(__APPLE__)` blocks) had, up to this job's
    # first green run, only ever been syntax-checked against a hand-written
    # stub on Linux (the job above) -- see
    # scripts/check_accelerate_syntax_linux.sh's own header comment and
    # docs/testing.md for exactly what that does and does not prove. This
    # job is where that claim ceiling was actually raised to "compiled,
    # linked, and run on real Apple Silicon." First-contact failures here
    # were expected and were treated as findings about the Accelerate
    # backend, not this workflow; the lane has since run green repeatedly
    # -- see docs/ci.md for how the first run's findings got folded back in.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}

      - name: Install ninja
        # AppleClang (the Xcode Command Line Tools' compiler) is used as-is
        # via CMAKE_CXX_COMPILER left unset in the macos-clang-release
        # preset -- no LLVM to install. Accelerate ships with the OS, so
        # there is no package-install step for the sparse backend either;
        # cmake/FindAccelerateSparse.cmake finds it via the SDK's default
        # framework search path.
        run: brew install ninja

      # ONE SOURCE for this job's machine label, exported to every later step.
      # It has two consumers and they must agree: the Test step, where the
      # committed Mac float rows are asserted, and the report step, where new
      # ones are derived. A float row is asserted only when the observing run's
      # machine string equals the row's, so a Test step running without this
      # label observes the host's uname instead, every Mac float row reports
      # CONTEXT-MISMATCH, and the lane gates counters and states while
      # silently checking no numbers at all. That was the state before this
      # step existed, with the label derived inside the report step alone.
      #
      # The label is derived from the runner IMAGE, not written as a literal,
      # and that is load-bearing rather than tidy: it has to name the runner
      # CLASS. A literal "macos-latest" names a moving alias, and GitHub has
      # repointed it at new hardware more than once -- pinned to an alias, a
      # float row goes on asserting across that change, same string, different
      # machine, which is precisely the substitution the context gate exists to
      # catch. Derived from $ImageOS, the label becomes github-macos27-arm64
      # the moment the image moves, the pin stops matching, and the affected
      # rows report CONTEXT-MISMATCH until someone re-derives them on the new
      # class. The guard is there because an unset $ImageOS would silently
      # produce a malformed-but-consistent label, which is the same quiet
      # failure wearing different clothes.
      - name: Derive this runner's machine-class label
        env:
          RUNNER_ARCH_LOWER: ${{ runner.arch }}
        run: |
          if [ -z "${ImageOS:-}" ]; then
            echo "ImageOS is unset: refusing to run with a machine label that does" >&2
            echo "not name this runner's image class." >&2
            exit 1
          fi
          label="github-${ImageOS}-$(echo "$RUNNER_ARCH_LOWER" | tr '[:upper:]' '[:lower:]')"
          echo "machine label for this job: $label"
          echo "HVEN_RIG_MACHINE=$label" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset macos-clang-release

      # `id` so the post-Test steps below can condition on THIS step rather
      # than on the default "nothing has failed yet": every one of them needs a
      # build tree and none of them needs a test result.
      - name: Build
        id: build
        run: cmake --build build-macos

      - name: Test
        # HVEN_RIG_MACHINE comes from the label step above (via $GITHUB_ENV),
        # which is what makes the committed Accelerate float rows genuinely
        # assert here rather than report CONTEXT-MISMATCH.
        run: ctest --test-dir build-macos --output-on-failure --timeout 300

      # Cheap half of the PCH check: assert the precompiled header is actually
      # applied to exactly the six translation units it is opted in for, by
      # reading this lane's own compile_commands.json. Catches "the PCH
      # silently stopped applying on macOS" -- a build-time regression no
      # test would notice -- for the cost of reading a JSON file.
      #
      # The full two-build byte-identity comparison runs on the Linux lane
      # only; doing it here would double this lane's build. docs/build.md
      # records that split and what it does and does not prove.
      #
      # WHY THIS AND THE THREE STEPS BELOW CARRY A CONDITION (M3 gate B). A
      # step with no `if:` runs only while no earlier step has failed, so a red
      # Test step silently skipped this gate, the install smoke, the export
      # contract and the observation emit on EVERY m3 run -- four checks
      # reported as "skipped" that nobody had decided to skip. None of them
      # reads a test result: this one reads compile_commands.json, the two
      # below build and consume an install tree, and the emit re-runs the rig
      # in report mode. Each now names the step it genuinely depends on -- a
      # successful Build -- so it runs on its own merits, while `!cancelled()`
      # keeps a cancelled job quiet. The ORDER is unchanged and the
      # dependencies that are real are still enforced; what is fixed is one
      # step's failure suppressing three later checks that never read it.
      - name: Assert PCH engagement (macOS)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./scripts/check_pch_neutrality.sh --engagement-only build-macos

      # Install-verification: this is the job that closes the one gap the
      # install/export rules had left -- the platform-macro export
      # (USE_ACCELERATE_SPARSE on Apple) and the computed
      # EIGEN_MAX_ALIGN_BYTES value had only ever been checked by reading
      # the CMakeLists.txt logic, never by inspecting an actual installed
      # hvenTargets.cmake on real Mac hardware. See scripts/
      # check_install_smoke.sh (configure/build/install/consume against a
      # scratch prefix) and scripts/check_export_contract.sh (the shared
      # assertion script also run on the Linux and Windows lanes, below
      # and above) for what is actually checked.
      - name: Run hven install smoke (configure/build/install/consume)
        id: install_smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          HVEN_INSTALL_SMOKE_WORKDIR: ${{ runner.temp }}/hven-install-smoke
          HVEN_INSTALL_SMOKE_JOBS: "3"
        run: ./scripts/check_install_smoke.sh

      # This one is gated on the smoke step specifically, not on `!cancelled()`
      # alone: it inspects the install tree that step produces, so without a
      # successful smoke there is nothing here to assert against and a bare
      # `!cancelled()` would turn a skip into a second, derivative failure.
      - name: Assert installed export contract (macOS)
        if: ${{ !cancelled() && steps.install_smoke.outcome == 'success' }}
        env:
          HVEN_INSTALL_SMOKE_WORKDIR: ${{ runner.temp }}/hven-install-smoke
        run: |
          set -euo pipefail
          targets_file="$(find "${HVEN_INSTALL_SMOKE_WORKDIR}/hven-install" -name hvenTargets.cmake -print -quit)"
          if [ -z "${targets_file}" ]; then
            echo "hvenTargets.cmake not found under ${HVEN_INSTALL_SMOKE_WORKDIR}/hven-install" >&2
            exit 1
          fi
          align="$(grep -oE 'resolved to [0-9]+' "${HVEN_INSTALL_SMOKE_WORKDIR}/hven-configure.log" | grep -oE '[0-9]+' || true)"
          if [ -z "${align}" ]; then
            echo "could not find the computed EIGEN_MAX_ALIGN_BYTES value in ${HVEN_INSTALL_SMOKE_WORKDIR}/hven-configure.log" >&2
            exit 1
          fi
          ./scripts/check_export_contract.sh "${targets_file}" apple "${align}"

      # The Accelerate arm of every expected table is UNOBSERVED, and this
      # runner is the only Apple hardware the project reaches. Report mode
      # emits each observation as a table row with its provenance columns
      # already filled, so uploading that file is what turns this lane from
      # "the Accelerate build is green" into a derivation the tables can be
      # filled from -- by copying rows out of the artifact, never by typing
      # a number a Mac was assumed to produce.
      #
      # It runs AFTER the gate above deliberately. Report mode still runs
      # each trace's structural self-checks, so a failure here is a real
      # finding rather than a reporting glitch -- but the same check already
      # ran in the step above, so this step failing on its own would mean
      # the two disagree, which is worth seeing rather than suppressing.
      # No continue-on-error for that reason; the upload is if:always() so
      # the artifact survives a failure and can be read.
      #
      # `!cancelled()` (M3 gate B): the upload was already if:always(), but
      # this step was not, so a red Test step meant the upload ran, found no
      # file, and failed on if-no-files-found -- the lane has never once
      # produced this artifact on m3. The whole point of the artifact is to
      # supply observations for adjudicating divergences, and a lane is red
      # precisely when there are divergences to adjudicate: gating the
      # evidence on the absence of the thing it explains is backwards.
      #
      # HVEN_RIG_MACHINE is NOT derived here. It comes from the label step
      # near the top of this job, so the rows this step emits and the rows the
      # Test step asserts are stamped by one source -- two derivations that
      # drifted apart would let a table be filled from a label nothing ever
      # asserts against. See that step for how the label is built and why it
      # names the image class rather than the runner alias.
      - name: Emit the Accelerate observations for derivation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          HVEN_RIG_REPORT_OUT: rig-report-accelerate.txt
        # No MKL_NUM_THREADS here: it would be decoration on this lane.
        # Accelerate never reads it -- and neither does anything else, on
        # this backend: the rig asks the native arm for num_threads = 1, but
        # hven's Accelerate session stores that count without applying it to
        # any backend call, so NOTHING is pinned here. Each emitted row
        # records that as its mechanism ('absent', value 0) rather than the
        # per-instance pin the MKL lane genuinely applies. Rows derived from
        # this lane are therefore reproduced across two separate runs before
        # being committed, which is the assurance a pin would otherwise give.
        run: |
          echo "machine label for this derivation: $HVEN_RIG_MACHINE"
          ./build-macos/tests/golden_rig/hven_golden_rig_report

      - name: Upload the Accelerate observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rig-report-accelerate
          path: rig-report-accelerate.txt
          if-no-files-found: error

  windows-clang-release:
    # Like the macOS job above, this was a first-contact lane: the
    # Windows/clang-cl compile-flag set in cmake/hven_compile_options.cmake
    # is a byte-for-byte copy of tycho's own already-Windows-verified flags
    # (compared directly against tycho's cmake/tycho_compile_options.cmake
    # at the time this job was written), but hven's own CMake plumbing
    # around it -- HVEN_FP_MODE's SAFER_FAST clang-cl feature-detection
    # check, cmake/FindMKL.cmake's Windows hint paths, MKL discovery via a
    # freshly-installed oneAPI on this exact runner image -- had not run
    # before this job. Green Windows runs have since exercised all of it
    # repeatedly; see docs/ci.md for the run-by-run evidence.
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Bump both together when Intel rotates the installer version --
      # pull the current value from
      # https://github.com/oneapi-src/oneapi-ci/blob/master/.github/workflows/build_all.yml
      # (WINDOWS_TOOLKIT_URL). See scripts/install_windows_mkl.bat's header
      # comment for how this URL and the component ids below were chosen.
      HVEN_ONEAPI_CACHE_KEY: windows-oneapi-2026.1.0.191-mkl.devel-openmp-v1
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}

      - name: Install ninja
        run: choco install ninja --no-progress -y

      - name: Cache Intel oneAPI MKL + OpenMP install
        id: cache-oneapi-mkl
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files (x86)\Intel\oneAPI\mkl
            C:\Program Files (x86)\Intel\oneAPI\compiler
          key: ${{ runner.os }}-${{ env.HVEN_ONEAPI_CACHE_KEY }}

      - name: Install Intel MKL (offline installer, cached)
        # The download itself (~1.9 GB self-extracting archive of the full
        # oneAPI Base+HPC toolkit) is what makes caching worth doing --
        # scripts/install_windows_mkl.bat only extracts the two components
        # this repo needs (MKL devel + the OpenMP runtime) from it via the
        # embedded bootstrapper's --components= flag, but the download cost
        # is paid regardless of how few components are selected.
        if: steps.cache-oneapi-mkl.outputs.cache-hit != 'true'
        shell: cmd
        run: scripts\install_windows_mkl.bat

      - name: Point FindMKL.cmake at the install
        # Mirrors the Linux job's ONEAPI_ROOT/MKLROOT step above:
        # cmake/FindMKL.cmake's environment-free fallback paths assume the
        # Linux oneAPI layout (/opt/intel/oneapi/...); MKLROOT/ONEAPI_ROOT
        # make it look in the actual Windows install location instead of
        # depending on a hardcoded fallback matching it.
        shell: bash
        run: |
          echo 'ONEAPI_ROOT=C:\Program Files (x86)\Intel\oneAPI' >> "$GITHUB_ENV"
          echo 'MKLROOT=C:\Program Files (x86)\Intel\oneAPI\mkl\latest' >> "$GITHUB_ENV"

      - name: Put the MKL / OpenMP runtime DLLs on PATH
        # hven links MKL's "static" import libraries (FindMKL.cmake selects
        # mkl_intel_lp64.lib / mkl_intel_thread.lib / mkl_core.lib, never the
        # BUILD_SHARED_LIBS-only _dll.lib names -- this project never turns
        # that on), but Intel's OpenMP runtime is ALWAYS a DLL on Windows:
        # libiomp5md.lib ("md" = multithreaded DLL CRT) is an import stub,
        # not a true static archive, so hven_tests.exe has a genuine
        # load-time DLL dependency regardless of how "static" the rest of
        # the link looks. Confirmed the hard way: run 31284216427 built and
        # linked hven_tests.exe successfully, then died with
        # STATUS_DLL_NOT_FOUND (0xc0000135) the moment CMake's own
        # gtest_discover_tests tried to execute it during the Build step
        # (see the DISCOVERY_MODE note in tests/CMakeLists.txt -- this repo
        # switches Windows to DISCOVERY_MODE PRE_TEST so that specific
        # failure mode moves to the Test step, but PRE_TEST still needs to
        # run the binary, at ctest time instead of build time, so the PATH
        # problem itself has to be fixed regardless of discovery mode).
        # Prepending here, before Configure, means every later step in this
        # job -- Build (whichever discovery mode is active) and Test alike --
        # inherits a PATH that can actually load the binary; $GITHUB_PATH
        # changes apply to every subsequent step in the job, not just the
        # next one. Paths are the Windows Intel-64 "bin (DLLs)" directories
        # from oneMKL's own Windows developer guide's high-level directory
        # structure ("<mkl directory>\bin (DLLs)"; the OpenMP RTL's DLL
        # under "<compiler directory>\bin", mirroring the exact \lib paths
        # the Configure step above already resolved MKL_INTERFACE_LIBRARY /
        # MKL_OMP_LIBRARY to).
        shell: bash
        run: |
          echo 'C:\Program Files (x86)\Intel\oneAPI\mkl\latest\bin' >> "$GITHUB_PATH"
          echo 'C:\Program Files (x86)\Intel\oneAPI\compiler\latest\bin' >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset windows-clang-release

      - name: Build
        run: cmake --build build-windows

      - name: Test
        # No HVEN_RIG_MACHINE here, by design -- same reason as the Linux lane:
        # the committed float rows name the machine they were derived on, this
        # runner is not it, and labelling it as such would make those rows
        # assert against hardware they were never observed on.
        run: ctest --test-dir build-windows --output-on-failure --timeout 300

      # Cheap half of the PCH check: assert the precompiled header is actually
      # applied to exactly the six translation units it is opted in for, by
      # reading this lane's own compile_commands.json. Catches "the PCH
      # silently stopped applying on Windows" -- a build-time regression no
      # test would notice -- for the cost of reading a JSON file.
      #
      # The full two-build byte-identity comparison runs on the Linux lane
      # only; doing it here would double this lane's build. docs/build.md
      # records that split and what it does and does not prove.
      - name: Assert PCH engagement (Windows)
        shell: bash
        run: ./scripts/check_pch_neutrality.sh --engagement-only build-windows

      # Install-verification, same as the Linux and macOS lanes above --
      # see scripts/check_install_smoke.sh and scripts/
      # check_export_contract.sh. shell: bash (matching the "Point
      # FindMKL.cmake..."/"Put the MKL... DLLs on PATH" steps above) since
      # both scripts are bash. The extra -D overrides forwarded to
      # check_install_smoke.sh are the same CMAKE_C(XX)_COMPILER/_AR/
      # _RANLIB/CMAKE_LINKER values windows-clang-release sets in
      # CMakePresets.json -- without them, a bare `cmake -S ... -B ...`
      # here would resolve whatever default toolchain a bash shell finds
      # instead of clang-cl, and the consumer's link would not match how
      # hven itself (or MKL's import libraries) were built.
      - name: Run hven install smoke (configure/build/install/consume)
        shell: bash
        env:
          HVEN_INSTALL_SMOKE_WORKDIR: ${{ runner.temp }}/hven-install-smoke
          HVEN_INSTALL_SMOKE_JOBS: "4"
        run: |
          ./scripts/check_install_smoke.sh \
            -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" \
            -DCMAKE_C_COMPILER_AR="C:/Program Files/LLVM/bin/llvm-ar.exe" \
            -DCMAKE_C_COMPILER_RANLIB="C:/Program Files/LLVM/bin/llvm-ranlib.exe" \
            -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang-cl.exe" \
            -DCMAKE_CXX_COMPILER_AR="C:/Program Files/LLVM/bin/llvm-ar.exe" \
            -DCMAKE_CXX_COMPILER_RANLIB="C:/Program Files/LLVM/bin/llvm-ranlib.exe" \
            -DCMAKE_LINKER="C:/Program Files/LLVM/bin/lld-link.exe"

      - name: Assert installed export contract (Windows)
        shell: bash
        env:
          HVEN_INSTALL_SMOKE_WORKDIR: ${{ runner.temp }}/hven-install-smoke
        run: |
          set -euo pipefail
          targets_file="$(find "${HVEN_INSTALL_SMOKE_WORKDIR}/hven-install" -name hvenTargets.cmake -print -quit)"
          if [ -z "${targets_file}" ]; then
            echo "hvenTargets.cmake not found under ${HVEN_INSTALL_SMOKE_WORKDIR}/hven-install" >&2
            exit 1
          fi
          align="$(grep -oE 'resolved to [0-9]+' "${HVEN_INSTALL_SMOKE_WORKDIR}/hven-configure.log" | grep -oE '[0-9]+' || true)"
          if [ -z "${align}" ]; then
            echo "could not find the computed EIGEN_MAX_ALIGN_BYTES value in ${HVEN_INSTALL_SMOKE_WORKDIR}/hven-configure.log" >&2
            exit 1
          fi
          ./scripts/check_export_contract.sh "${targets_file}" windows "${align}"

      - name: Save oneAPI install logs
        if: always() && steps.cache-oneapi-mkl.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-oneapi-install-logs
          path: |
            extract.log
            bootstrapper*
            installer*
