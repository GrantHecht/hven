name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, for the one thing this workflow does that is not a
  # gate: the macOS job's report-mode artifact is the only route this
  # project has to a real Accelerate observation, and asking for one
  # should not require inventing a commit to push. See docs/ci.md.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-clang-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}

      - name: Install ninja and clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build libomp-dev

      - name: Install Intel MKL via the oneAPI apt repository
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-mkl-devel
          # cmake/FindMKL.cmake's only environment-free fallback paths are
          # /opt/intel/oneapi/mkl/latest/{include,lib,lib/intel64} and, for
          # libiomp5, /opt/intel/oneapi/compiler/latest/lib. Every other
          # oneAPI layout it knows how to search (older packages put
          # libiomp5 under compiler/latest/linux/compiler/lib/intel64_lin,
          # for example) is reachable only via $ENV{ONEAPI_ROOT} /
          # $ENV{MKLROOT}. Exporting both here makes MKL discovery
          # able to find libiomp5 outside the hardcoded fallbacks instead of depending on apt happening to match
          # the three hardcoded fallbacks.
          echo "ONEAPI_ROOT=/opt/intel/oneapi" >> "$GITHUB_ENV"
          echo "MKLROOT=/opt/intel/oneapi/mkl/latest" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset linux-clang-release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Accelerate backend syntax check (Linux, stubbed)
        # Cheap (a handful of `clang++ -fsyntax-only` calls, no MKL/network
        # needed) and Linux-runnable, so it belongs in the same job rather
        # than a separate one. Keeps scripts/check_accelerate_syntax_linux.sh's
        # claim -- "syntax-checked against stubs on Linux" -- continuously
        # true instead of rotting silently the first time someone edits the
        # Accelerate TUs without running it locally. See that script's own
        # header comment and docs/testing.md for exactly what this does and
        # does not prove; it is not a substitute for the Mac hardware leg.
        run: ./scripts/check_accelerate_syntax_linux.sh

  macos-clang-release:
    # This job raised the milestone's Apple-hardware claim ceiling: the
    # Accelerate session, shim, and Apple-gated test halves
    # (src/linear/accelerate_session.cpp, symmetric_factor_accelerate.cpp,
    # tests/linear's `#if defined(__APPLE__)` blocks) had, up to this job's
    # first green run, only ever been syntax-checked against a hand-written
    # stub on Linux (the job above) -- see
    # scripts/check_accelerate_syntax_linux.sh's own header comment and
    # docs/testing.md for exactly what that does and does not prove. This
    # job is where that claim ceiling was actually raised to "compiled,
    # linked, and run on real Apple Silicon." First-contact failures here
    # were expected and were treated as findings about the Accelerate
    # backend, not this workflow; the lane has since run green repeatedly
    # -- see docs/ci.md for how the first run's findings got folded back in.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}

      - name: Install ninja
        # AppleClang (the Xcode Command Line Tools' compiler) is used as-is
        # via CMAKE_CXX_COMPILER left unset in the macos-clang-release
        # preset -- no LLVM to install. Accelerate ships with the OS, so
        # there is no package-install step for the sparse backend either;
        # cmake/FindAccelerateSparse.cmake finds it via the SDK's default
        # framework search path.
        run: brew install ninja

      - name: Configure
        run: cmake --preset macos-clang-release

      - name: Build
        run: cmake --build build-macos

      - name: Test
        run: ctest --test-dir build-macos --output-on-failure

      # The Accelerate arm of every expected table is UNOBSERVED, and this
      # runner is the only Apple hardware the project reaches. Report mode
      # emits each observation as a table row with its provenance columns
      # already filled, so uploading that file is what turns this lane from
      # "the Accelerate build is green" into a derivation the tables can be
      # filled from -- by copying rows out of the artifact, never by typing
      # a number a Mac was assumed to produce.
      #
      # It runs AFTER the gate above deliberately. Report mode still runs
      # each trace's structural self-checks, so a failure here is a real
      # finding rather than a reporting glitch -- but the same check already
      # ran in the step above, so this step failing on its own would mean
      # the two disagree, which is worth seeing rather than suppressing.
      # No continue-on-error for that reason; the upload is if:always() so
      # the artifact survives a failure and can be read.
      - name: Emit the Accelerate observations for derivation
        env:
          HVEN_RIG_MACHINE: github-macos-latest-apple-silicon
          HVEN_RIG_REPORT_OUT: rig-report-accelerate.txt
        # No MKL_NUM_THREADS here: it would be decoration on this lane.
        # Accelerate never reads it, and the native arm is the one seam
        # that pins per-instance anyway -- the rig sets num_threads = 1 on
        # the instance itself, which is the mechanism each emitted row
        # records.
        run: ./build-macos/tests/golden_rig/hven_golden_rig_report

      - name: Upload the Accelerate observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rig-report-accelerate
          path: rig-report-accelerate.txt
          if-no-files-found: error

  windows-clang-release:
    # Like the macOS job above, this was a first-contact lane: the
    # Windows/clang-cl compile-flag set in cmake/hven_compile_options.cmake
    # is a byte-for-byte copy of tycho's own already-Windows-verified flags
    # (compared directly against tycho's cmake/tycho_compile_options.cmake
    # at the time this job was written), but hven's own CMake plumbing
    # around it -- HVEN_FP_MODE's SAFER_FAST clang-cl feature-detection
    # check, cmake/FindMKL.cmake's Windows hint paths, MKL discovery via a
    # freshly-installed oneAPI on this exact runner image -- had not run
    # before this job. Green Windows runs have since exercised all of it
    # repeatedly; see docs/ci.md for the run-by-run evidence.
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Bump both together when Intel rotates the installer version --
      # pull the current value from
      # https://github.com/oneapi-src/oneapi-ci/blob/master/.github/workflows/build_all.yml
      # (WINDOWS_TOOLKIT_URL). See scripts/install_windows_mkl.bat's header
      # comment for how this URL and the component ids below were chosen.
      HVEN_ONEAPI_CACHE_KEY: windows-oneapi-2026.1.0.191-mkl.devel-openmp-v1
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}

      - name: Install ninja
        run: choco install ninja --no-progress -y

      - name: Cache Intel oneAPI MKL + OpenMP install
        id: cache-oneapi-mkl
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files (x86)\Intel\oneAPI\mkl
            C:\Program Files (x86)\Intel\oneAPI\compiler
          key: ${{ runner.os }}-${{ env.HVEN_ONEAPI_CACHE_KEY }}

      - name: Install Intel MKL (offline installer, cached)
        # The download itself (~1.9 GB self-extracting archive of the full
        # oneAPI Base+HPC toolkit) is what makes caching worth doing --
        # scripts/install_windows_mkl.bat only extracts the two components
        # this repo needs (MKL devel + the OpenMP runtime) from it via the
        # embedded bootstrapper's --components= flag, but the download cost
        # is paid regardless of how few components are selected.
        if: steps.cache-oneapi-mkl.outputs.cache-hit != 'true'
        shell: cmd
        run: scripts\install_windows_mkl.bat

      - name: Point FindMKL.cmake at the install
        # Mirrors the Linux job's ONEAPI_ROOT/MKLROOT step above:
        # cmake/FindMKL.cmake's environment-free fallback paths assume the
        # Linux oneAPI layout (/opt/intel/oneapi/...); MKLROOT/ONEAPI_ROOT
        # make it look in the actual Windows install location instead of
        # depending on a hardcoded fallback matching it.
        shell: bash
        run: |
          echo 'ONEAPI_ROOT=C:\Program Files (x86)\Intel\oneAPI' >> "$GITHUB_ENV"
          echo 'MKLROOT=C:\Program Files (x86)\Intel\oneAPI\mkl\latest' >> "$GITHUB_ENV"

      - name: Put the MKL / OpenMP runtime DLLs on PATH
        # hven links MKL's "static" import libraries (FindMKL.cmake selects
        # mkl_intel_lp64.lib / mkl_intel_thread.lib / mkl_core.lib, never the
        # BUILD_SHARED_LIBS-only _dll.lib names -- this project never turns
        # that on), but Intel's OpenMP runtime is ALWAYS a DLL on Windows:
        # libiomp5md.lib ("md" = multithreaded DLL CRT) is an import stub,
        # not a true static archive, so hven_tests.exe has a genuine
        # load-time DLL dependency regardless of how "static" the rest of
        # the link looks. Confirmed the hard way: run 31284216427 built and
        # linked hven_tests.exe successfully, then died with
        # STATUS_DLL_NOT_FOUND (0xc0000135) the moment CMake's own
        # gtest_discover_tests tried to execute it during the Build step
        # (see the DISCOVERY_MODE note in tests/CMakeLists.txt -- this repo
        # switches Windows to DISCOVERY_MODE PRE_TEST so that specific
        # failure mode moves to the Test step, but PRE_TEST still needs to
        # run the binary, at ctest time instead of build time, so the PATH
        # problem itself has to be fixed regardless of discovery mode).
        # Prepending here, before Configure, means every later step in this
        # job -- Build (whichever discovery mode is active) and Test alike --
        # inherits a PATH that can actually load the binary; $GITHUB_PATH
        # changes apply to every subsequent step in the job, not just the
        # next one. Paths are the Windows Intel-64 "bin (DLLs)" directories
        # from oneMKL's own Windows developer guide's high-level directory
        # structure ("<mkl directory>\bin (DLLs)"; the OpenMP RTL's DLL
        # under "<compiler directory>\bin", mirroring the exact \lib paths
        # the Configure step above already resolved MKL_INTERFACE_LIBRARY /
        # MKL_OMP_LIBRARY to).
        shell: bash
        run: |
          echo 'C:\Program Files (x86)\Intel\oneAPI\mkl\latest\bin' >> "$GITHUB_PATH"
          echo 'C:\Program Files (x86)\Intel\oneAPI\compiler\latest\bin' >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset windows-clang-release

      - name: Build
        run: cmake --build build-windows

      - name: Test
        run: ctest --test-dir build-windows --output-on-failure

      - name: Save oneAPI install logs
        if: always() && steps.cache-oneapi-mkl.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-oneapi-install-logs
          path: |
            extract.log
            bootstrapper*
            installer*
          retention-days: 7
          if-no-files-found: ignore
